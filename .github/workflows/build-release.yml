name: Build and Release Portable Windows App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'RELEASE_VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile sources
        run: python -m compileall -q src tools

      - name: Windows smoke tests
        run: >-
          python -m pytest -v
          tests/test_board_tracker.py
          tests/test_presence.py
          tests/test_inspector.py
          tests/test_runtime.py

  build:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        run: |
          $version = (Get-Content "RELEASE_VERSION" -Raw).Trim()
          if (-not $version) {
            throw "RELEASE_VERSION está vacío"
          }
          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "El tag ${{ github.ref_name }} no coincide con RELEASE_VERSION ($tag)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "TuRobotics_Inspeccion_V5" `
            --add-data "config;config" `
            --add-data "data/v5/models;data/v5/models" `
            --add-data "data/v5/references;data/v5/references" `
            --add-data "assets;assets" `
            src/inspection_v5/qt_app.py

      - name: Package portable distribution
        run: |
          Copy-Item "README.md" -Destination "dist/TuRobotics_Inspeccion_V5/"
          Copy-Item "docs/RELEASE_NOTES_V5.1.md" -Destination "dist/TuRobotics_Inspeccion_V5/RELEASE_NOTES.md"
          Copy-Item "config/plantilla_inspeccion_carta_v1.pdf" -Destination "dist/TuRobotics_Inspeccion_V5/"
          Compress-Archive -Path "dist/TuRobotics_Inspeccion_V5" -DestinationPath "TuRobotics_Inspeccion_Visual_V5.1_Portable_Windows.zip"

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TuRobotics Inspección Visual V${{ steps.release_meta.outputs.version }} (Portable)
          body_path: docs/RELEASE_NOTES_V5.1.md
          files: TuRobotics_Inspeccion_Visual_V5.1_Portable_Windows.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inspeccion-visual-v4"
version = "4.0.0"
description = "Inspección CPU de un ensamble LEGO de diez componentes con tablero ArUco"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "opencv-contrib-python>=4.8",
  "Pillow>=9.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "scikit-learn>=1.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
